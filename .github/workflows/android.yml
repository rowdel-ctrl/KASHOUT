name: Build Android APK

# Builds only when someone starts it by hand (Actions tab > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write # lets the build publish a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Add the Firebase file
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Warn when Firebase is missing
        if: env.GOOGLE_SERVICES_JSON_BASE64 == ''
        run: echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set. This APK will be a DEMO with sample data only."

      - name: Add the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Warn when the signing key is missing
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::KEYSTORE_BASE64 is not set. The APK is signed with a throwaway test key and cannot be updated later."

      - name: Build the web app
        run: npm run build

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Show the signing fingerprint (SHA-1)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          {
            echo "### Signing fingerprint"
            echo "Add this SHA-1 to your Android app in Firebase (Project settings):"
            echo '```'
            keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA-1"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/cashout-log.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cashout-log-apk
          path: out/cashout-log.apk
          if-no-files-found: error

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Install on Android: download cashout-log.apk and open it. Built from commit ${GITHUB_SHA::7}."
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then NOTE="DEMO build (sample data only). $NOTE"; fi
          gh release create "v${VERSION_NAME}" out/cashout-log.apk \
            --target "$GITHUB_SHA" \
            --title "Kashawt ${VERSION_NAME}" \
            --notes "$NOTE"
